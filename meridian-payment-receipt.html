<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — moved</title>
<meta http-equiv="refresh" content="0; url=https://mymeridianworkspace.com/forms/portal.html">
<link rel="canonical" href="https://mymeridianworkspace.com/forms/portal.html">
<script>
  // Redirect synchronously in <head> so the body never paints in the
  // common case. The meta-refresh below is the no-JS fallback.
  try { window.location.replace('https://mymeridianworkspace.com/forms/portal.html'); } catch (e) {}
</script>
<style>
  :root{
    --bg:#f7f5f2; --surface:#ffffff; --border:#e6e0d6;
    --accent:#1e3a5f; --muted:#7a7466; --text:#1a1a1a;
    --serif:'EB Garamond',Garamond,'Adobe Garamond Pro',Georgia,serif;
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'DM Mono','SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  /* Hide the body by default — only show it if both JS and meta-refresh
     somehow fail to navigate within ~600ms (e.g. extreme network blocks). */
  body{visibility:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
  body.show{visibility:visible;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:48px 44px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(30,58,95,0.06);text-align:center;}
  .logo{font-family:var(--serif);font-size:28px;font-weight:500;color:var(--accent);margin-bottom:8px;}
  .sub{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.22em;margin-bottom:32px;}
  p{font-size:15px;line-height:1.55;margin-bottom:18px;color:var(--text);}
  .btn{display:inline-block;background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.18em;padding:14px 28px;border-radius:3px;text-decoration:none;margin-top:8px;}
  .btn:hover{background:#142a47;}
  .small{margin-top:24px;font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.16em;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Meridian Insurance</div>
  <div class="sub">Workspace has moved</div>
  <p>This page has moved to the <strong>Meridian Agency Workspace</strong>.</p>
  <p>You'll be redirected automatically. If nothing happens in a few seconds, click below.</p>
  <a class="btn" href="https://mymeridianworkspace.com/forms/portal.html">Open Meridian Workspace</a>
  <div class="small">mymeridianworkspace.com</div>
</div>
<script>
  // Belt-and-suspenders: if for some reason neither the head-script nor
  // the meta-refresh has navigated us away after 600ms, reveal the body
  // so the user sees the click-here button.
  setTimeout(function(){ document.body.classList.add('show'); }, 600);
  // And keep trying to redirect (some browsers honor the second call
  // even if the first was blocked by an extension).
  try { window.location.replace('https://mymeridianworkspace.com/forms/portal.html'); } catch (e) {}
</script>
</body>
</html>
